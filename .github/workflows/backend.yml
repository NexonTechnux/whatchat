name: Whatchat Ephemeral Backend

on:
  workflow_dispatch:

jobs:
  run-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Start ephemeral backend
        run: |
          cd backend
          node server.js
